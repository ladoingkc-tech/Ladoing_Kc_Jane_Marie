
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student API Interface</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fff0f5;
            margin: 0;
            padding: 30px 15px;
            color: #5c3545;
        }

        .container {
            max-width: 600px;
            margin: 30px auto;
        }

        h1 {
            text-align: center;
            color: white;
            background-color: #f28bb3;
            padding: 25px 15px;
            border-radius: 15px;
            font-size: 27px;
            box-shadow: 0 4px 10px rgba(230, 100, 150, 0.2);
        }

        .card {
            background-color: #ffffff;
            padding: 25px;
            margin-top: 22px;
            border-radius: 15px;
            border: 1px solid #ffd6e5;
            box-shadow: 0 4px 12px rgba(230, 100, 150, 0.12);
        }

        h2 {
            color: #e75480;
            margin-top: 0;
            font-size: 21px;
        }

        p {
            line-height: 1.6;
        }

        button {
            background-color: #ec6f9e;
            color: white;
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background-color: #d94f83;
            transform: translateY(-2px);
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0 15px;
            border: 1px solid #f4b6cc;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 14px;
            background-color: #fffafd;
            color: #5c3545;
        }

        input:focus {
            outline: none;
            border-color: #ec6f9e;
            box-shadow: 0 0 0 3px #ffe0eb;
        }

        input::placeholder {
            color: #c18b9e;
        }

        #result {
            margin-top: 18px;
        }

        .student-info {
            background-color: #fff0f6;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #ffd6e5;
        }

        .student-info p {
            padding: 9px 0;
            margin: 0;
            border-bottom: 1px solid #f8d5e2;
            overflow-wrap: anywhere;
        }

        .student-info p:last-child {
            border-bottom: none;
        }

        #greeting {
            margin-top: 15px;
            color: #d63375;
            font-weight: bold;
            overflow-wrap: anywhere;
        }

        .footer {
            text-align: center;
            margin-top: 25px;
            color: #b87994;
            font-size: 13px;
        }

        @media (max-width: 480px) {
            h1 {
                font-size: 23px;
            }

            .card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>🎀 Student API Interface 🎀</h1>

        <!-- Student Information Section -->
        <div class="card">
            <h2>🌸 Student Information</h2>
            <p>Click the button below to view student details.</p>

            <button onclick="loadStudent()">
                Load Student Information
            </button>

            <div id="result"></div>
        </div>

        <!-- Greeting API Section -->
        <div class="card">
            <h2>💗 Greeting API</h2>
            <p>Enter your first name to receive a sweet greeting!</p>

            <input
                type="text"
                id="nameInput"
                placeholder="Enter your first name"
                maxlength="100"
            >

            <button onclick="sayHello()">Say Hello 💕</button>

            <p id="greeting"></p>
        </div>

        <div class="footer">
            ♡ Student API Interface | Made with love ♡
        </div>

    </div>

    <script>
        // Load student information
        function loadStudent() {
            fetch('/student')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to load student data');
                    }
                    return response.json();
                })
                .then(data => {
                    const result = document.getElementById('result');
                    result.replaceChildren();

                    const info = document.createElement('div');
                    info.className = 'student-info';

                    const fields = [
                        ['Student ID', data.student_id],
                        ['Name', data.name],
                        ['Program', data.program],
                        ['Year', data.year],
                        ['Section', data.section]
                    ];

                    fields.forEach(([label, value]) => {
                        const p = document.createElement('p');
                        const b = document.createElement('b');

                        b.textContent = label + ': ';
                        p.appendChild(b);
                        p.appendChild(
                            document.createTextNode(
                                value == null ? '' : String(value)
                            )
                        );

                        info.appendChild(p);
                    });

                    result.appendChild(info);
                })
                .catch(error => {
                    document.getElementById('result').textContent =
                        'Unable to retrieve student data. Please try again.';
                });
        }

        // Greeting API
        function sayHello() {
            const name = document.getElementById('nameInput').value.trim();
            const greeting = document.getElementById('greeting');

            if (!name) {
                greeting.style.color = '#d63333';
                greeting.textContent = 'Please enter your first name. 💕';
                return;
            }

            fetch('/hello?name=' + encodeURIComponent(name))
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Failed to load greeting');
                    }
                    return response.json();
                })
                .then(data => {
                    greeting.style.color = '#d63375';
                    greeting.textContent = data.message;
                })
                .catch(error => {
                    greeting.style.color = '#d63333';
                    greeting.textContent =
                        'Unable to retrieve greeting. Please try again.';
                });
        }
    </script>
</body>
</html>
